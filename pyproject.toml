[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jobmatch"
version = "0.1.0"
description = "Explainable resume-to-job matching: skill extraction with a curated taxonomy, blind screening, transparent scoring, candidate ranking and skill-gap analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Goyal" }]
keywords = ["nlp", "resume", "job-matching", "information-extraction", "explainable-ai", "fairness", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2", "ruff>=0.5", "pypdf>=4.0"]

[project.scripts]
jobmatch = "jobmatch.cli:main"

[project.urls]
Repository = "https://github.com/Krishna-44/resume-job-matcher"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatch"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
